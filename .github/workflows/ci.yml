name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # swiftly (swift.org's toolchain installer) for the jobs that install Swift
  # on macOS. The versioned .pkg is pinned and checked, so a new swiftly
  # release cannot change CI unnoticed.
  SWIFTLY_VERSION: "1.2.0"
  SWIFTLY_SHA256: a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    env:
      # swift-format comes with the toolchain, so it is pinned with it.
      SWIFT_VERSION: "6.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: swift-format (lint mode, strict)
        run: |
          swift format --version
          swift format lint --strict --recursive --configuration .swift-format \
            Package.swift Sources Tests

  test-macos:
    name: Run macOS Tests
    runs-on: macos-26
    env:
      SWIFT_VERSION: "6.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The runner's default Xcode ships an older Swift; install the exact
      # toolchain with swiftly so macOS and Linux build with the same compiler.
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      # The CLI has no unit tests of its own: check one report end to end, and
      # that with no terminal attached (as on a runner) it writes nothing and
      # exits successfully.
      - name: CLI smoke test
        run: |
          bin="$(swift build --show-bin-path)/program-status"
          expected='\e]7501;state=working:app=photos:msg=U3luY2luZyBwaG90b3M=\e\'
          test "$("$bin" working "Syncing photos" --app photos --dry-run)" = "$expected"
          test -z "$("$bin" working "Syncing photos" --app photos < /dev/null)"

  test-linux:
    name: Run Linux Tests (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.3 is the package's swift-tools-version, the oldest compiler it
        # claims to support; 6.4 is the compiler the macOS job uses.
        swift: ["6.3", "6.4"]
    container:
      image: swift:${{ matrix.swift }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: CLI smoke test
        run: |
          bin="$(swift build --show-bin-path)/program-status"
          expected='\e]7501;state=working:app=photos:msg=U3luY2luZyBwaG90b3M=\e\'
          test "$("$bin" working "Syncing photos" --app photos --dry-run)" = "$expected"
          test -z "$("$bin" working "Syncing photos" --app photos < /dev/null)"
